project:
  name: TCC_Energia_Robusto
  description: Localizacao otima de usinas renovaveis com analise multicriterio geoespacial.

paths:
  substations: data/raw/ons/subestacoes.geojson
  transmission_lines: data/raw/ons/linhas.geojson
  solar_raster: data/raw/solar/irradiancia_global.tif
  wind_raster: data/raw/eolico/velocidade_vento.tif
  demand_points: data/raw/demanda/demanda.geojson
  roads: data/raw/infra/rodovias.geojson
  water_resources: data/raw/hidrografia/recursos_hidricos.geojson
  urban_areas: data/raw/urbano/areas_urbanas.geojson
  slope_raster: data/raw/topografia/declividade_percent.tif
  land_use_raster: data/raw/uso_solo/aptidao_solo.tif
  restrictions: data/raw/restricoes/restricoes.geojson
  outputs: outputs

analysis:
  crs_geographic: EPSG:4326
  crs_projected: EPSG:5880
  grid_spacing_km: 50
  max_distance_grid_km: 250
  default_scenario: hibrido

weights:
  solar:
    solar_potential: 0.35
    wind_potential: 0.05
    grid_distance: 0.15
    demand_distance: 0.10
    road_distance: 0.08
    water_distance: 0.05
    urban_distance: 0.05
    slope: 0.10
    land_use: 0.07
    connection_cost: 0.00
  eolico:
    solar_potential: 0.05
    wind_potential: 0.40
    grid_distance: 0.18
    demand_distance: 0.10
    road_distance: 0.08
    water_distance: 0.00
    urban_distance: 0.07
    slope: 0.07
    land_use: 0.05
    connection_cost: 0.00
  hibrido:
    solar_potential: 0.25
    wind_potential: 0.25
    grid_distance: 0.15
    demand_distance: 0.10
    road_distance: 0.07
    water_distance: 0.03
    urban_distance: 0.05
    slope: 0.05
    land_use: 0.05
    connection_cost: 0.00
  infraestrutura:
    solar_potential: 0.10
    wind_potential: 0.10
    grid_distance: 0.30
    demand_distance: 0.20
    road_distance: 0.20
    water_distance: 0.00
    urban_distance: 0.00
    slope: 0.05
    land_use: 0.05
    connection_cost: 0.00
  ambiental:
    solar_potential: 0.15
    wind_potential: 0.10
    grid_distance: 0.05
    demand_distance: 0.02
    road_distance: 0.03
    water_distance: 0.00
    urban_distance: 0.15
    slope: 0.20
    land_use: 0.30
    connection_cost: 0.00

fuzzy:
  solar_potential:
    lower: 4.2
    upper: 6.0
  wind_potential:
    lower: 5.0
    upper: 8.5
  grid_distance:
    lower: 10
    upper: 120
  demand_distance:
    lower: 25
    upper: 250
  road_distance:
    lower: 5
    upper: 80
  water_distance:
    lower: 10
    upper: 120
  urban_distance:
    lower: 5
    upper: 30
  slope:
    lower: 2
    upper: 8

thresholds:
  min_solar_kwh_m2_day: 4.5
  min_wind_m_s: 5.5
  restriction_policy: exclude
  restriction_penalty_factor: 0.35

costs:
  grid_connection_cost_per_km_brl: 1200000
  road_access_cost_per_km_brl: 250000
  water_access_cost_per_km_brl: 180000
  connection_cost_per_km_brl: 1200000
